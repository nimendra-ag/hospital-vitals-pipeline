global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # FastAPI serving layer — long-running, scraped directly.
  - job_name: "hospital-vitals-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # Producer / lab generator / speed layer / batch layer push here
  # because they are short-lived or non-HTTP processes.
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  # Kafka broker/topic/consumer-group visibility.
  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
